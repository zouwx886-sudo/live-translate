<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>课堂实时翻译</title>
<meta name="theme-color" content="#111418">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="课堂翻译">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root{--bg:#111418;--card:#1b2027;--fg:#f2f4f7;--muted:#8a94a3;--acc:#3ea6ff;--red:#ff5c5c;--warn:#ffb020}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif}
  body{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
  header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid #262c35}
  header h1{font-size:18px;margin:0}
  #status{font-size:13px;color:var(--muted)}
  #status.on{color:#4cd964}
  #toolbar{display:flex;gap:8px;align-items:center;padding:8px 14px;border-bottom:1px solid #262c35}
  #lang{flex:1;min-width:0;font-size:15px;padding:8px 10px;border-radius:8px;border:1px solid #3a4250;background:#2a313b;color:var(--fg)}
  #meterBtn{flex:none;font-size:13px;padding:8px 12px;border-radius:8px;font-weight:600;background:#2a313b;color:var(--fg)}
  #meterBtn.on{background:#1e3a2f;color:#4cd964}
  #meter-wrap{display:none;padding:8px 14px 10px;border-bottom:1px solid #262c35}
  #meter-wrap.show{display:block}
  #meter-bar{height:8px;background:#2a313b;border-radius:6px;overflow:hidden}
  #meter-fill{height:100%;width:0;background:#4cd964;border-radius:6px;transition:width .08s linear,background .2s}
  #meter-fill.low{background:var(--warn)}
  #meter-label{font-size:11px;color:var(--muted);margin-top:4px}
  #hint{display:none;margin:10px 14px 0;padding:12px;border-radius:10px;background:#3a2a10;color:var(--warn);font-size:15px;line-height:1.5}
  #msg{display:none;margin:10px 14px;padding:12px;border-radius:10px;background:#3a2a10;color:var(--warn);font-size:15px;line-height:1.5}
  #msg.err{background:#3a1515;color:#ff9a9a}
  #log{flex:1;overflow-y:auto;padding:12px 14px 20px;-webkit-overflow-scrolling:touch}
  .entry{background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:10px}
  .entry .meta{font-size:11px;color:var(--muted)}
  .entry .en{font-size:14px;color:#b7c0cc;margin:3px 0 6px;line-height:1.4}
  .entry .zh{font-size:24px;line-height:1.45;font-weight:500}
  .entry .zh.pending{color:var(--muted);font-size:18px}
  #interim{min-height:28px;padding:8px 14px;color:#d7dee8;font-size:18px;border-top:1px solid #262c35}
  #interim:empty{min-height:0;padding:0;border-top:0}
  #empty{color:var(--muted);text-align:center;margin-top:24vh;font-size:16px;line-height:1.7}
  footer{display:flex;gap:10px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));border-top:1px solid #262c35;background:var(--bg)}
  button{flex:1;font-size:17px;padding:14px 6px;border:0;border-radius:12px;background:#2a313b;color:var(--fg);font-weight:600}
  button:active{opacity:.7}
  #toggle{flex:1.6;background:var(--acc);color:#001425}
  #toggle.running{background:var(--red);color:#fff}
  .sz{display:flex;gap:6px}
  .sz button{flex:none;padding:6px 10px;font-size:14px;border-radius:8px}
</style>
</head>
<body>
<header>
  <div><h1>课堂实时翻译</h1><div id="status">未开始</div></div>
  <div class="sz"><button id="smaller" aria-label="缩小字体">A-</button><button id="bigger" aria-label="放大字体">A+</button></div>
</header>
<div id="toolbar">
  <select id="lang" aria-label="识别口音">
    <option value="en-GB">英式英语</option>
    <option value="en-US">美式英语</option>
    <option value="en-IN">印度英语</option>
    <option value="en-AU">澳式英语</option>
    <option value="en-SG">新加坡英语</option>
  </select>
  <button type="button" id="meterBtn" class="on" aria-pressed="true">音量条：开</button>
</div>
<div id="meter-wrap">
  <div id="meter-bar"><div id="meter-fill"></div></div>
  <div id="meter-label">麦克风音量（条很短就说明离老师太远或声音太小）</div>
</div>
<div id="hint"></div>
<div id="msg"></div>
<div id="log"><div id="empty">点下面的「开始」，把手机尽量靠近老师。<br>英文会自动翻译成中文。<br>请用 Chrome 打开（不要用微信、QQ 或 vivo 自带浏览器）。</div></div>
<div id="interim"></div>
<footer>
  <button id="toggle">开始</button>
  <button id="clear">清空</button>
  <button id="export">导出笔记</button>
</footer>
<script src="app.js"></script>
</body>
</html>
